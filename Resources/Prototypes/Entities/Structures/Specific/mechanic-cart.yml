#mechanic cart

- type: entity
  name: mechanic cart
  id: MechanicCart
  parent: [BaseStructureDynamic, StructureWheeled]
  description: Every mechanic's best friend.
  components:
    - type: Sprite
      noRot: true
      sprite: Objects/Specific/Janitorial/janitorial_cart.rsi
      layers:
        - state: cart
        - state: cart_water-1
          map: ["enum.SolutionContainerLayers.Fill"]
          visible: false
    - type: Rotatable
    - type: InteractionOutline
    - type: ItemSlots
